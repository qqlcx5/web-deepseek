<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit Chat</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#5b56d6',
            'brand-hover': '#4a45bd',
            'brand-soft': '#efefff',
            ink: '#172033',
            muted: '#667085',
            line: '#e5e7eb',
            surface: '#ffffff',
            surface2: '#f8fafc',
            success: '#16875d',
            danger: '#d92d20',
            warning: '#b54708'
          },
          boxShadow: {
            soft: '0 1px 3px rgba(16,24,40,.06)',
            panel: '0 6px 20px rgba(16,24,40,.07)',
            dialog: '0 24px 70px rgba(16,24,40,.24)'
          }
        }
      }
    }
  </script>

  <script type="module">
    import { createApp, ref, computed, nextTick } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
    import {
      MessageCircle, Search, Settings, Sun, Moon, Monitor, Plus, MoreHorizontal,
      ChevronDown, ChevronLeft, ChevronRight, PanelRight, Copy, ThumbsUp, ThumbsDown,
      RotateCcw, Pencil, Paperclip, Globe, Send, Square, Check, AlertCircle,
      Cloud, CloudOff, Database, SlidersHorizontal, Command, Menu, X, Trash2,
      Download, Upload, RefreshCw, Bot, UserRound, Sparkles, FileText, Image,
      Pin, PinOff, ExternalLink, Keyboard, ShieldCheck, Zap, CheckCircle2,
      CircleAlert, LoaderCircle
    } from 'https://unpkg.com/lucide-vue-next@0.468.0/dist/esm/lucide-vue-next.js'

    const app = createApp({
      components: {
        MessageCircle, Search, Settings, Sun, Moon, Monitor, Plus, MoreHorizontal,
        ChevronDown, ChevronLeft, ChevronRight, PanelRight, Copy, ThumbsUp, ThumbsDown,
        RotateCcw, Pencil, Paperclip, Globe, Send, Square, Check, AlertCircle,
        Cloud, CloudOff, Database, SlidersHorizontal, Command, Menu, X, Trash2,
        Download, Upload, RefreshCw, Bot, UserRound, Sparkles, FileText, Image,
        Pin, PinOff, ExternalLink, Keyboard, ShieldCheck, Zap, CheckCircle2,
        CircleAlert, LoaderCircle
      },

      setup() {
        const activeView = ref('chat')
        const mobileSidebar = ref(false)
        const inspectorOpen = ref(true)
        const settingsGroup = ref('appearance')
        const showCommand = ref(false)
        const showNewAssistant = ref(false)
        const showNewTopic = ref(false)
        const showDeleteDialog = ref(false)
        const showTopicMenu = ref(null)
        const selectedScope = ref('all')
        const searchQuery = ref('')
        const draft = ref('')
        const isGenerating = ref(false)
        const isDark = ref(false)
        const toast = ref('')
        const selectedAssistant = ref('orbit')
        const selectedTopic = ref('launch')
        const selectedModel = ref('gpt-4o')
        const newAssistantName = ref('')
        const newTopicName = ref('')

        const assistants = ref([
          { id: 'orbit', name: 'Orbit 助手', initials: 'O', color: 'bg-brand' },
          { id: 'writer', name: '写作编辑', initials: 'W', color: 'bg-emerald-500' },
          { id: 'code', name: '代码伙伴', initials: 'C', color: 'bg-sky-500' }
        ])

        const topics = ref([
          {
            id: 'launch',
            assistant: 'orbit',
            title: '产品发布计划',
            pinned: true,
            updatedAt: '刚刚',
            messages: [
              {
                id: 1,
                role: 'user',
                status: 'complete',
                text: '帮我整理 Orbit Chat 的产品发布计划，重点关注首发版本的核心功能。'
              },
              {
                id: 2,
                role: 'assistant',
                status: 'complete',
                thinking: '我会先按首发必要性拆分功能，再给出分阶段发布建议。',
                text: '可以。Orbit Chat 的首发版本建议围绕 **本地优先、多 Provider 对话和数据可控** 三条主线展开。\n\n### 首发必须完成\n\n1. **基础对话体验**\n   - OpenAI 兼容、Anthropic、Ollama\n   - 流式正文与思考内容\n   - 停止生成、错误重试\n   - Markdown、代码块、附件展示\n\n2. **本地数据管理**\n   - Assistant 与 Topic 管理\n   - IndexedDB 持久化\n   - Cherry Studio 格式导入导出\n   - 默认导出时剔除 API Key\n\n3. **可恢复与可备份**\n   - S3 / WebDAV 全量备份\n   - 保存状态和同步状态\n   - 清空数据安全确认\n\n建议先让用户可以稳定完成「配置模型 → 开始对话 → 刷新恢复 → 导出备份」这条完整路径。'
              },
              {
                id: 3,
                role: 'user',
                status: 'complete',
                text: '那搜索和移动端应该放在首发吗？'
              },
              {
                id: 4,
                role: 'assistant',
                status: 'complete',
                text: '建议这样安排：\n\n- **搜索**：首发保留基础全文搜索。它直接影响历史消息可找回性，MiniSearch 足够支持 100 个 Topic 和 5000 条消息。\n- **移动端**：首发支持响应式布局，但可以先保证对话、切换 Topic 和发送消息三个核心流程。\n- **高级能力**：分支、工具块、URL 内容注入、自动命名放到第二阶段。'
              }
            ]
          },
          {
            id: 'architecture',
            assistant: 'orbit',
            title: '本地优先架构讨论',
            pinned: false,
            updatedAt: '昨天',
            messages: [
              {
                id: 5,
                role: 'user',
                status: 'complete',
                text: 'IndexedDB 和 Cherry Studio 数据格式应该如何兼容？'
              },
              {
                id: 6,
                role: 'assistant',
                status: 'complete',
                text: '建议将 Cherry JSON 作为导入导出的稳定边界，应用内部使用更适合 UI 更新的实体结构。同步时上传完整 Cherry 快照，避免引入复杂的实体级冲突解决 UI。'
              }
            ]
          },
          {
            id: 'marketing',
            assistant: 'writer',
            title: 'Landing Page 文案',
            pinned: false,
            updatedAt: '3 天前',
            messages: [
              {
                id: 7,
                role: 'user',
                status: 'complete',
                text: '为 Orbit Chat 写一句简洁的产品标语。'
              },
              {
                id: 8,
                role: 'assistant',
                status: 'complete',
                text: '你的模型，你的数据，你的对话空间。'
              }
            ]
          }
        ])

        const currentAssistant = computed(() =>
          assistants.value.find(item => item.id === selectedAssistant.value)
        )

        const currentTopic = computed(() =>
          topics.value.find(item => item.id === selectedTopic.value)
        )

        const currentTopics = computed(() =>
          topics.value
            .filter(item => item.assistant === selectedAssistant.value)
            .sort((a, b) => Number(b.pinned) - Number(a.pinned))
        )

        const searchResults = computed(() => {
          const query = searchQuery.value.trim().toLowerCase()
          if (!query) return topics.value.slice().sort((a, b) => b.updatedAt.localeCompare(a.updatedAt))

          return topics.value.filter(topic => {
            if (selectedScope.value === 'current' && topic.assistant !== selectedAssistant.value) {
              return false
            }

            return topic.title.toLowerCase().includes(query) ||
              topic.messages.some(message => message.text.toLowerCase().includes(query))
          })
        })

        const settings = [
          { id: 'appearance', label: '外观', icon: Sun },
          { id: 'input', label: '输入', icon: Keyboard },
          { id: 'providers', label: 'Provider 与模型', icon: Zap },
          { id: 'assistants', label: '助手', icon: Bot },
          { id: 'context', label: '上下文', icon: SlidersHorizontal },
          { id: 'sync', label: '同步与存储', icon: Cloud },
          { id: 'data', label: '数据管理', icon: Database }
        ]

        function notify(message) {
          toast.value = message
          setTimeout(() => toast.value = '', 2600)
        }

        function selectAssistant(id) {
          selectedAssistant.value = id
          const firstTopic = topics.value.find(topic => topic.assistant === id)
          if (firstTopic) selectedTopic.value = firstTopic.id
          mobileSidebar.value = false
        }

        function selectTopic(id) {
          selectedTopic.value = id
          activeView.value = 'chat'
          mobileSidebar.value = false
          showTopicMenu.value = null
        }

        function createTopic() {
          const title = newTopicName.value.trim() || '新对话'
          const id = `topic-${Date.now()}`
          topics.value.unshift({
            id,
            assistant: selectedAssistant.value,
            title,
            pinned: false,
            updatedAt: '刚刚',
            messages: []
          })
          selectedTopic.value = id
          newTopicName.value = ''
          showNewTopic.value = false
          notify('已创建新话题')
        }

        function createAssistant() {
          const name = newAssistantName.value.trim() || '新助手'
          const id = `assistant-${Date.now()}`
          assistants.value.push({
            id,
            name,
            initials: name.slice(0, 1),
            color: 'bg-violet-500'
          })
          selectedAssistant.value = id
          newAssistantName.value = ''
          showNewAssistant.value = false
          notify('已创建助手')
        }

        function deleteTopic() {
          const index = topics.value.findIndex(topic => topic.id === selectedTopic.value)
          topics.value.splice(index, 1)
          const next = topics.value.find(topic => topic.assistant === selectedAssistant.value)
          selectedTopic.value = next?.id || ''
          showDeleteDialog.value = false
          notify('话题已删除')
        }

        function togglePin(topic) {
          topic.pinned = !topic.pinned
          showTopicMenu.value = null
          notify(topic.pinned ? '已置顶话题' : '已取消置顶')
        }

        function sendMessage() {
          const text = draft.value.trim()
          if (!text || !currentTopic.value || isGenerating.value) return

          currentTopic.value.messages.push({
            id: Date.now(),
            role: 'user',
            status: 'complete',
            text
          })
          draft.value = ''
          isGenerating.value = true

          const assistantMessage = {
            id: Date.now() + 1,
            role: 'assistant',
            status: 'streaming',
            thinking: '正在整理上下文并生成回答……',
            text: ''
          }
          currentTopic.value.messages.push(assistantMessage)

          const response = '这是一个可交互的 Orbit Chat 原型回答。当前已支持话题切换、搜索视图、设置分组、响应式侧栏，以及模拟流式消息状态。'
          let index = 0
          const timer = setInterval(() => {
            assistantMessage.text += response[index] || ''
            index += 1
            if (index >= response.length) {
              clearInterval(timer)
              assistantMessage.status = 'complete'
              assistantMessage.thinking = ''
              isGenerating.value = false
              notify('回答已完成')
            }
          }, 28)
        }

        function stopGeneration() {
          isGenerating.value = false
          const message = currentTopic.value?.messages.at(-1)
          if (message?.role === 'assistant' && message.status === 'streaming') {
            message.status = 'stopped'
            message.thinking = ''
          }
          notify('已停止生成')
        }

        function copyMessage(text) {
          navigator.clipboard?.writeText(text)
          notify('已复制消息')
        }

        function highlight(text) {
          if (!searchQuery.value.trim()) return text
          const escaped = searchQuery.value.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark class="bg-yellow-200 rounded px-0.5">$1</mark>')
        }

        function openSearchFromSidebar() {
          activeView.value = 'search'
          selectedScope.value = 'current'
          mobileSidebar.value = false
        }

        function handleShortcut(event) {
          if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
            event.preventDefault()
            showCommand.value = true
          }
          if (event.key === 'Escape') {
            showCommand.value = false
            mobileSidebar.value = false
          }
        }

        window.addEventListener('keydown', handleShortcut)

        return {
          activeView, mobileSidebar, inspectorOpen, settingsGroup, showCommand,
          showNewAssistant, showNewTopic, showDeleteDialog, selectedScope,
          searchQuery, draft, isGenerating, isDark, toast, selectedAssistant,
          selectedTopic, selectedModel, newAssistantName, newTopicName,
          assistants, topics, settings, currentAssistant, currentTopic,
          currentTopics, searchResults, selectAssistant, selectTopic, createTopic,
          createAssistant, deleteTopic, togglePin, sendMessage, stopGeneration,
          copyMessage, highlight, openSearchFromSidebar, notify
        }
      },

      template: `
        <div
          :class="{ dark: isDark }"
          class="min-h-screen bg-slate-50 text-ink"
        >
          <div class="flex h-screen overflow-hidden">

            <!-- Desktop rail -->
            <aside class="hidden md:flex w-[68px] shrink-0 flex-col items-center border-r border-line bg-white py-4">
              <div class="mb-8 flex h-10 w-10 items-center justify-center rounded-xl bg-brand text-white shadow-soft">
                <OrbitIcon />
              </div>

              <nav class="flex flex-col gap-3">
                <button
                  @click="activeView = 'chat'"
                  :class="activeView === 'chat' ? 'bg-brand-soft text-brand' : 'text-muted hover:bg-slate-100'"
                  class="flex h-11 w-11 items-center justify-center rounded-xl transition"
                  title="对话"
                  aria-label="对话"
                >
                  <MessageCircle :size="20" />
                </button>

                <button
                  @click="activeView = 'search'"
                  :class="activeView === 'search' ? 'bg-brand-soft text-brand' : 'text-muted hover:bg-slate-100'"
                  class="flex h-11 w-11 items-center justify-center rounded-xl transition"
                  title="搜索"
                  aria-label="搜索"
                >
                  <Search :size="20" />
                </button>

                <button
                  @click="activeView = 'settings'"
                  :class="activeView === 'settings' ? 'bg-brand-soft text-brand' : 'text-muted hover:bg-slate-100'"
                  class="flex h-11 w-11 items-center justify-center rounded-xl transition"
                  title="设置"
                  aria-label="设置"
                >
                  <Settings :size="20" />
                </button>
              </nav>

              <div class="mt-auto flex flex-col items-center gap-4">
                <button
                  @click="isDark = !isDark"
                  class="text-muted hover:text-ink"
                  title="切换主题"
                  aria-label="切换主题"
                >
                  <Sun v-if="!isDark" :size="19" />
                  <Moon v-else :size="19" />
                </button>

                <div class="relative">
                  <div class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-100 text-sm font-semibold text-slate-600">L</div>
                  <span class="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full border-2 border-white bg-emerald-500"></span>
                </div>
              </div>
            </aside>

            <!-- Mobile header -->
            <header class="fixed left-0 right-0 top-0 z-30 flex h-14 items-center justify-between border-b border-line bg-white px-4 md:hidden">
              <button @click="mobileSidebar = true" title="打开菜单" aria-label="打开菜单">
                <Menu :size="21" />
              </button>
              <div class="flex items-center gap-2 font-semibold">
                <div class="flex h-7 w-7 items-center justify-center rounded-lg bg-brand text-white">
                  <OrbitIcon :size="16" />
                </div>
                Orbit Chat
              </div>
              <button @click="showCommand = true" title="打开命令面板" aria-label="打开命令面板">
                <Command :size="20" />
              </button>
            </header>

            <!-- Chat sidebar -->
            <aside
              v-if="activeView === 'chat'"
              :class="mobileSidebar ? 'translate-x-0' : '-translate-x-full md:translate-x-0'"
              class="fixed inset-y-0 left-0 z-50 flex w-[286px] shrink-0 flex-col border-r border-line bg-white transition-transform md:relative md:z-0"
            >
              <div class="flex h-[60px] items-center justify-between border-b border-line px-4">
                <div class="flex items-center gap-2 font-semibold">
                  <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-soft text-brand">
                    <Sparkles :size="17" />
                  </div>
                  Orbit Chat
                </div>
                <button @click="mobileSidebar = false" class="md:hidden text-muted" title="关闭侧栏" aria-label="关闭侧栏">
                  <X :size="19" />
                </button>
              </div>

              <div class="border-b border-line p-3">
                <div class="mb-3 flex items-center justify-between">
                  <span class="text-xs font-semibold uppercase tracking-wider text-muted">助手</span>
                  <button @click="showNewAssistant = true" class="text-brand hover:text-brand-hover" title="新建助手" aria-label="新建助手">
                    <Plus :size="17" />
                  </button>
                </div>

                <div class="flex gap-2 overflow-x-auto pb-1">
                  <button
                    v-for="assistant in assistants"
                    :key="assistant.id"
                    @click="selectAssistant(assistant.id)"
                    :class="selectedAssistant === assistant.id ? 'border-brand bg-brand-soft' : 'border-transparent hover:bg-slate-50'"
                    class="flex min-w-fit items-center gap-2 rounded-lg border px-2 py-1.5 text-left transition"
                  >
                    <span :class="assistant.color" class="flex h-6 w-6 items-center justify-center rounded-md text-xs font-semibold text-white">
                      {{ assistant.initials }}
                    </span>
                    <span class="max-w-[110px] truncate text-xs font-medium">{{ assistant.name }}</span>
                  </button>
                </div>
              </div>

              <div class="flex items-center justify-between px-4 pb-2 pt-4">
                <span class="text-xs font-semibold uppercase tracking-wider text-muted">话题</span>
                <div class="flex gap-1">
                  <button @click="openSearchFromSidebar" class="rounded-md p-1.5 text-muted hover:bg-slate-100 hover:text-ink" title="搜索话题" aria-label="搜索话题">
                    <Search :size="16" />
                  </button>
                  <button @click="showNewTopic = true" class="rounded-md p-1.5 text-brand hover:bg-brand-soft" title="新建话题" aria-label="新建话题">
                    <Plus :size="16" />
                  </button>
                </div>
              </div>

              <div class="flex-1 overflow-y-auto px-2">
                <div v-if="currentTopics.length === 0" class="px-4 py-12 text-center">
                  <MessageCircle class="mx-auto mb-3 text-slate-300" :size="28" />
                  <p class="text-sm font-medium">还没有话题</p>
                  <button @click="showNewTopic = true" class="mt-3 text-sm text-brand">开始新对话</button>
                </div>

                <div v-else class="space-y-1">
                  <div
                    v-for="topic in currentTopics"
                    :key="topic.id"
                    @click="selectTopic(topic.id)"
                    :class="selectedTopic === topic.id ? 'bg-brand-soft text-brand' : 'text-slate-600 hover:bg-slate-50'"
                    class="group relative flex cursor-pointer items-center gap-3 rounded-lg px-3 py-3 transition"
                  >
                    <MessageCircle :size="16" class="shrink-0 opacity-70" />
                    <div class="min-w-0 flex-1">
                      <div class="truncate text-sm font-medium">{{ topic.title }}</div>
                      <div class="mt-0.5 text-[11px] opacity-60">{{ topic.updatedAt }} · {{ topic.messages.length }} 条消息</div>
                    </div>

                    <Pin v-if="topic.pinned" :size="13" class="shrink-0 opacity-70" />

                    <button
                      @click.stop="showTopicMenu = showTopicMenu === topic.id ? null : topic.id"
                      class="hidden rounded p-1 hover:bg-white group-hover:block"
                      title="话题菜单"
                      aria-label="话题菜单"
                    >
                      <MoreHorizontal :size="16" />
                    </button>

                    <div v-if="showTopicMenu === topic.id" class="absolute right-2 top-10 z-20 w-36 rounded-lg border border-line bg-white p-1.5 text-sm shadow-panel">
                      <button @click.stop="togglePin(topic)" class="flex w-full items-center gap-2 rounded-md px-2 py-2 hover:bg-slate-50">
                        <Pin :size="14" /> {{ topic.pinned ? '取消置顶' : '置顶' }}
                      </button>
                      <button @click.stop="showDeleteDialog = true; selectedTopic = topic.id; showTopicMenu = null" class="flex w-full items-center gap-2 rounded-md px-2 py-2 text-danger hover:bg-red-50">
                        <Trash2 :size="14" /> 删除话题
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <div class="border-t border-line p-3">
                <div class="flex items-center justify-between rounded-lg bg-slate-50 px-3 py-2.5">
                  <div class="flex items-center gap-2">
                    <Cloud :size="16" class="text-success" />
                    <div>
                      <div class="text-xs font-medium">已保存</div>
                      <div class="text-[10px] text-muted">本地 IndexedDB</div>
                    </div>
                  </div>
                  <button @click="activeView = 'settings'; settingsGroup = 'sync'" class="text-muted hover:text-brand" title="同步设置" aria-label="同步设置">
                    <ChevronRight :size="16" />
                  </button>
                </div>
              </div>
            </aside>

            <div v-if="mobileSidebar" @click="mobileSidebar = false" class="fixed inset-0 z-40 bg-slate-900/30 md:hidden"></div>

            <!-- Main -->
            <main class="min-w-0 flex-1 bg-white pt-14 md:pt-0">

              <!-- Chat view -->
              <section v-if="activeView === 'chat'" class="flex h-full min-w-0">
                <div class="flex min-w-0 flex-1 flex-col">
                  <header class="flex h-[60px] shrink-0 items-center justify-between border-b border-line px-4 lg:px-6">
                    <div class="flex min-w-0 items-center gap-3">
                      <button @click="mobileSidebar = true" class="md:hidden text-muted" title="打开话题侧栏" aria-label="打开话题侧栏">
                        <Menu :size="19" />
                      </button>
                      <div class="min-w-0">
                        <div class="truncate text-sm font-semibold">{{ currentTopic?.title || '新对话' }}</div>
                        <div class="flex items-center gap-1.5 text-[11px] text-muted">
                          <span class="h-1.5 w-1.5 rounded-full bg-success"></span>
                          {{ currentAssistant?.name }} · {{ selectedModel }} · OpenAI Compatible
                        </div>
                      </div>
                    </div>

                    <div class="flex items-center gap-2">
                      <button @click="showCommand = true" class="hidden items-center gap-2 rounded-lg border border-line px-2.5 py-1.5 text-xs text-muted hover:bg-slate-50 sm:flex">
                        <Command :size="14" /> 快捷操作 <kbd class="rounded bg-slate-100 px-1.5 py-0.5 text-[10px]">⌘K</kbd>
                      </button>
                      <button @click="inspectorOpen = !inspectorOpen" class="rounded-lg p-2 text-muted hover:bg-slate-100 hover:text-ink" title="切换检查器" aria-label="切换检查器">
                        <PanelRight :size="18" />
                      </button>
                    </div>
                  </header>

                  <div class="flex-1 overflow-y-auto px-4 py-8 lg:px-8">
                    <div class="mx-auto max-w-[820px]">

              <button @click="activeView = 'chat'" :class="activeView === 'chat' ? 'text-brand' : 'text-muted'" class="flex flex-col items-center gap-1 text-[10px]"><MessageCircle :size="19" />对话</button>
              <button @click="activeView = 'search'" :class="activeView === 'search' ? 'text-brand' : 'text-muted'" class="flex flex-col items-center gap-1 text-[10px]"><Search :size="19" />搜索</button>
              <button @click="activeView = 'settings'" :class="activeView === 'settings' ? 'text-brand' : 'text-muted'" class="flex flex-col items-center gap-1 text-[10px]"><Settings :size="19" />设置</button>
            </nav>
          </div>

          <!-- Command panel -->
          <div v-if="showCommand" @click.self="showCommand = false" class="fixed inset-0 z-[80] flex items-start justify-center bg-slate-900/30 px-4 pt-[15vh]">
            <div class="w-full max-w-[560px] overflow-hidden rounded-2xl border border-line bg-white shadow-dialog">
              <div class="flex items-center gap-3 border-b border-line px-4">
                <Search class="text-muted" :size="19" />
                <input autofocus placeholder="搜索话题、设置项或操作……" class="h-14 flex-1 text-sm outline-none" />
                <kbd class="rounded bg-slate-100 px-2 py-1 text-[10px] text-muted">ESC</kbd>
              </div>
              <div class="p-2">
                <button @click="showNewTopic = true; showCommand = false" class="flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left text-sm hover:bg-brand-soft"><Plus :size="17" class="text-brand" />新建话题 <span class="ml-auto text-xs text-muted">⌘ N</span></button>
                <button @click="activeView = 'search'; showCommand = false" class="flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left text-sm hover:bg-brand-soft"><Search :size="17" class="text-brand" />搜索对话</button>
                <button @click="activeView = 'settings'; showCommand = false" class="flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left text-sm hover:bg-brand-soft"><Settings :size="17" class="text-brand" />打开设置</button>
              </div>
            </div>
          </div>

          <!-- New topic dialog -->
          <div v-if="showNewTopic" class="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/30 px-4">
            <div class="w-full max-w-[420px] rounded-2xl bg-white p-6 shadow-dialog">
              <div class="flex items-center justify-between">
                <h2 class="font-semibold">新建话题</h2>
                <button @click="showNewTopic = false" title="关闭" aria-label="关闭"><X :size="18" class="text-muted" /></button>
              </div>
              <input v-model="newTopicName" @keydown.enter="createTopic" autofocus placeholder="例如：产品发布计划" class="mt-5 h-11 w-full rounded-lg border border-line px-3 text-sm outline-none focus:border-brand" />
              <div class="mt-5 flex justify-end gap-2">
                <button @click="showNewTopic = false" class="rounded-lg px-4 py-2 text-sm text-muted hover:bg-slate-50">取消</button>
                <button @click="createTopic" class="rounded-lg bg-brand px-4 py-2 text-sm font-medium text-white">创建话题</button>
              </div>
            </div>
          </div>

          <!-- New assistant dialog -->
          <div v-if="showNewAssistant" class="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/30 px-4">
            <div class="w-full max-w-[420px] rounded-2xl bg-white p-6 shadow-dialog">
              <div class="flex items-center justify-between">
                <h2 class="font-semibold">新建助手</h2>
                <button @click="showNewAssistant = false" title="关闭" aria-label="关闭"><X :size="18" class="text-muted" /></button>
              </div>
              <input v-model="newAssistantName" @keydown.enter="createAssistant" autofocus placeholder="例如：研究助手" class="mt-5 h-11 w-full rounded-lg border border-line px-3 text-sm outline-none focus:border-brand" />
              <div class="mt-5 flex justify-end gap-2">
                <button @click="showNewAssistant = false" class="rounded-lg px-4 py-2 text-sm text-muted hover:bg-slate-50">取消</button>
                <button @click="createAssistant" class="rounded-lg bg-brand px-4 py-2 text-sm font-medium text-white">创建助手</button>
              </div>
            </div>
          </div>

          <!-- Delete dialog -->
          <div v-if="showDeleteDialog" class="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/30 px-4">
            <div class="w-full max-w-[420px] rounded-2xl bg-white p-6 shadow-dialog">
              <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-red-50 text-danger"><CircleAlert :size="22" /></div>
              <h2 class="mt-4 font-semibold">删除这个话题？</h2>
              <p class="mt-2 text-sm leading-6 text-muted">话题中的消息将从本地 IndexedDB 中删除。此操作不可撤销。</p>
              <div class="mt-6 flex justify-end gap-2">
                <button @click="showDeleteDialog = false" class="rounded-lg px-4 py-2 text-sm text-muted hover:bg-slate-50">取消</button>
                <button @click="deleteTopic" class="rounded-lg bg-danger px-4 py-2 text-sm font-medium text-white">确认删除</button>
              </div>
            </div>
          </div>

          <div v-if="toast" class="fixed bottom-5 left-1/2 z-[100] flex -translate-x-1/2 items-center gap-2 rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-panel">
            <CheckCircle2 :size="16" class="text-emerald-300" />{{ toast }}
          </div>
        </div>
      `
    })

    app.component('OrbitIcon', {
      props: { size: { type: Number, default: 19 } },
      template: `
        <svg :width="size" :height="size" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-28 12 12)"></ellipse>
          <circle cx="20.5" cy="7.5" r="1.4" fill="currentColor" stroke="none"></circle>
        </svg>
      `
    })

    app.component('Toggle', {
      props: { checked: Boolean },
      template: `
        <button
          :class="checked ? 'bg-brand' : 'bg-slate-200'"
          class="relative h-6 w-11 rounded-full transition"
          role="switch"
          :aria-checked="checked"
          title="切换"
        >
          <span :class="checked ? 'translate-x-6' : 'translate-x-1'" class="absolute left-0 top-1 h-4 w-4 rounded-full bg-white shadow-sm transition"></span>
        </button>
      `
    })

    app.component('SettingHeader', {
      props: ['title', 'description'],
      template: `
        <div class="mb-7 border-b border-line pb-5">
          <h2 class="text-xl font-semibold">{{ title }}</h2>
          <p class="mt-1 text-sm text-muted">{{ description }}</p>
        </div>
      `
    })

    app.component('SettingRow', {
      props: ['title', 'description'],
      template: `
        <div class="flex flex-col gap-4 border-b border-line py-5 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <div class="text-sm font-medium">{{ title }}</div>
            <div class="mt-1 text-xs text-muted">{{ description }}</div>
          </div>
          <div class="shrink-0"><slot /></div>
        </div>
      `
    })

    app.mount('#app')
  </script>

  <style>
    :root {
      --line: #e5e7eb;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #d0d5dd transparent;
    }

    body {
      margin: 0;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #172033;
    }

    .dark {
      filter: invert(.92) hue-rotate(180deg);
    }

    .dark img,
    .dark video,
    .dark iframe {
      filter: invert(1) hue-rotate(180deg);
    }

    mark {
      color: inherit;
    }

    textarea {
      min-height: 64px;
    }

    @media (max-width: 767px) {
      main {
        padding-bottom: 58px;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
</body>
</html>
